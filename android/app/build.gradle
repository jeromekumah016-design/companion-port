plugins {
    id 'com.android.application'
}

android {
    namespace 'com.companionport.extractor'
    compileSdk 34

    defaultConfig {
        applicationId "com.companionport.extractor"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // MainActivity extends AppCompatActivity; without this the app does not compile.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    testImplementation 'junit:junit:4.13.2'
}
